---
# 独立第三方密钥扫描闸门
#
# 为什么需要它：
#   本仓库的 scripts/audit-secrets.ps1 是"作者自己写的扫描器"。
#   实测已经证明——**作者的扫描器扫不出作者自己的盲区**：
#   曾把真实用户名拆成字符串拼接来绕过自家规则，导致规则被"特意适配"后失效。
#   因此必须挂一道**实现独立**的闸门，与本仓库的脚本互为补充。
#
# 本工作流使用 gitleaks（开源、规则集与作者无关），在每次 push / PR 时自动运行。
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks 全历史扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出（含完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 0 = 全历史，便于发现"曾提交过、后来删掉"的凭据

      - name: 运行 gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
