<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 190 1600 960" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Superagent 在 Ubuntu 上跑通全流程 · 架构图 v3</title>
  <desc id="diagram-desc">人工只抽查，GitHub 与飞书两个入口把事件送进笔记本上的 Router 编排层；Router 按四条规则判断接不接，派工给两个 Worker 在独立 worktree 里干活，PR 与报告回到原对话。Windows 跑不通，Linux 一次通。来源：furoute/dsh docs/DSH-Superagent-Ubuntu-deployment-and-tests.md（edb9063）。字号按缩到手机宽度 750px 仍可读设计。</desc>

  <defs>
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.2" fill="#30363d" opacity="0.52"/>
    </pattern>

    <marker id="arrow-user" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-agent" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-adb" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fbbf24"/>
    </marker>

    <style>
      svg {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
        color: #e6edf3;
      }
      .mono { font-family: "Cascadia Mono", "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 60px; font-weight: 800; letter-spacing: -1.1px; }
      .subtitle { fill: #a8b3bf; font-size: 23px; font-weight: 550; }
      .zone-label { font-size: 30px; font-weight: 750; }
      .zone-sub { fill: #a6b0bc; font-size: 23.5px; font-weight: 550; }
      .node-title { font-size: 34px; font-weight: 800; letter-spacing: -0.3px; }
      .node-sub { fill: #d5dde5; font-size: 25px; font-weight: 650; }
      .node-fine { fill: #aab4bf; font-size: 23.5px; font-weight: 550; }
      .edge-label { font-size: 23.5px; font-weight: 700; paint-order: stroke; }
      .footnote { fill: #a6b0bc; font-size: 23.5px; font-weight: 550; }
      .zone {
        fill: #0b1220;
        fill-opacity: 0.28;
        stroke: #d29922;
        stroke-opacity: 0.58;
        stroke-width: 1.5;
        stroke-dasharray: 9 7;
      }
      .node { stroke-width: 2; }
      .connector { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .label-bg {
        fill: #0d1117;
        fill-opacity: 0.98;
        stroke: #30363d;
        stroke-width: 1.2;
      }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#0d1117"/>
  <rect width="1600" height="1200" fill="url(#dot-grid)"/>

  <g id="zones">
    <rect x="48" y="205" width="378" height="930" rx="20" class="zone"/>
    <rect x="552" y="205" width="502" height="930" rx="20" class="zone"/>
    <rect x="1170" y="205" width="382" height="930" rx="20" class="zone"/>
  </g>

  <g id="zone-headers">
    <g aria-label="入口分区">
      <rect x="72" y="226" width="44" height="32" rx="8" fill="#13212c" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="94" y="249" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#67e8f9">01</text>
      <text x="128" y="252" class="zone-label" fill="#67e8f9">入口</text>
      <text x="72" y="285" class="zone-sub">人发需求 · 两个渠道</text>
    </g>

    <g aria-label="编排层分区">
      <rect x="576" y="226" width="44" height="32" rx="8" fill="#0d201d" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="598" y="249" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#34d399">02</text>
      <text x="632" y="252" class="zone-label" fill="#34d399">编排层</text>
      <text x="576" y="285" class="zone-sub">笔记本 · Ubuntu 24.04</text>
    </g>

    <g aria-label="执行与产出分区">
      <rect x="1194" y="226" width="44" height="32" rx="8" fill="#2a2110" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="1216" y="249" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#fbbf24">03</text>
      <text x="1250" y="252" class="zone-label" fill="#fbbf24">执行与产出</text>
      <text x="1194" y="285" class="zone-sub">独立执行 · 回到原处</text>
    </g>
  </g>

  <!-- ===== Zone 01: 入口 ===== -->
  <g id="node-human" aria-label="人工">
    <rect x="68" y="326" width="330" height="200" rx="18" fill="#0d1b24" stroke="#38bdf8" stroke-opacity="0.92" class="node"/>
    <rect x="68" y="326" width="5" height="200" rx="2.5" fill="#67e8f9"/>
    <text x="86" y="384" class="node-title" fill="#f8fafc">人工</text>
    <text x="86" y="424" class="node-sub">只抽查，不盯着</text>
    <text x="86" y="486" class="node-fine">提需求 · 验收结果</text>
    <text x="86" y="514" class="node-fine">人点合并，算完成</text>
  </g>

  <g id="node-entry" aria-label="两个入口">
    <rect x="68" y="596" width="330" height="190" rx="18" fill="#0d1b24" stroke="#38bdf8" stroke-opacity="0.92" class="node"/>
    <text x="86" y="644" class="node-title" fill="#f8fafc">两个入口</text>
    <text x="86" y="680" class="node-sub">GitHub · Issue · PR</text>
    <text x="86" y="708" class="node-sub">飞书群 · @机器人</text>
    <text x="86" y="742" class="node-fine">@agent · 60 秒轮询</text>
    <text x="86" y="770" class="node-fine">白名单空着 = 谁都派不了</text>
  </g>

  <g id="note-windows" aria-label="Windows 跑不通">
    <rect x="68" y="866" width="330" height="190" rx="14" fill="#0b1220" stroke="#30363d" stroke-dasharray="6 5" stroke-width="1.2"/>
    <text x="86" y="908" class="mono" font-size="20" font-weight="700" fill="#fb7185" letter-spacing="1">WINDOWS 跑不通</text>
    <text x="86" y="950" class="node-fine">POSIX 路径反斜杠失败</text>
    <text x="86" y="980" class="node-fine">loopback 绑 0.0.0.0 报错</text>
    <text x="86" y="1010" class="node-fine" fill="#34d399">Linux 一次通</text>
  </g>

  <!-- ===== Zone 02: 编排层 ===== -->
  <g id="node-router" aria-label="Router 编排层">
    <rect x="632" y="326" width="342" height="190" rx="18" fill="#0d201d" stroke="#34d399" stroke-opacity="0.92" class="node"/>
    <rect x="632" y="326" width="5" height="190" rx="2.5" fill="#34d399"/>
    <text x="654" y="374" class="node-title" fill="#f8fafc">Router · 编排层</text>
    <text x="654" y="410" class="node-sub">评估→立项→派工</text>
    <text x="654" y="438" class="node-sub">跟踪→结案 · 每步留档</text>
    <text x="654" y="472" class="node-fine">DSH 0.2.2-rc.1</text>
    <text x="654" y="500" class="node-fine">只绑 127.0.0.1:7788</text>
  </g>

  <g id="node-model" aria-label="模型可换">
    <rect x="632" y="596" width="342" height="190" rx="18" fill="#0d201d" stroke="#34d399" stroke-opacity="0.92" class="node"/>
    <text x="654" y="644" class="node-title" fill="#f8fafc">模型可换</text>
    <text x="654" y="680" class="node-sub">DeepSeek / LightVela</text>
    <text x="654" y="708" class="node-sub">入口模型都可换</text>
    <text x="654" y="742" class="node-fine">密钥走环境变量</text>
    <text x="654" y="770" class="node-fine">换模型不用改编排</text>
  </g>

  <g id="node-rules" aria-label="四条规则">
    <rect x="632" y="866" width="342" height="190" rx="18" fill="#0d201d" stroke="#34d399" stroke-opacity="0.92" class="node"/>
    <text x="654" y="914" class="node-title" fill="#f8fafc">四条规则</text>
    <text x="654" y="950" class="node-sub">copy · visual</text>
    <text x="654" y="978" class="node-sub">docs · deps</text>
    <text x="654" y="1012" class="node-fine">规则外，一律先问</text>
    <text x="654" y="1040" class="node-fine">没说清位置就先问</text>
  </g>

  <!-- ===== Zone 03: 执行与产出 ===== -->
  <g id="node-worker" aria-label="Worker">
    <rect x="1198" y="326" width="322" height="190" rx="18" fill="#241d0c" stroke="#fbbf24" stroke-opacity="0.92" class="node"/>
    <rect x="1198" y="326" width="5" height="190" rx="2.5" fill="#fbbf24"/>
    <text x="1218" y="374" class="node-title" fill="#f8fafc">Worker ×2</text>
    <text x="1218" y="410" class="node-sub">独立 worktree</text>
    <text x="1218" y="438" class="node-sub">一卡一目录</text>
    <text x="1218" y="472" class="node-fine">maxWorkers 2</text>
    <text x="1218" y="500" class="node-fine">prepare 失败不重试</text>
  </g>

  <g id="node-pr" aria-label="PR 与报告">
    <rect x="1198" y="596" width="322" height="190" rx="18" fill="#241d0c" stroke="#fbbf24" stroke-opacity="0.92" class="node"/>
    <text x="1218" y="644" class="node-title" fill="#f8fafc">PR / 报告</text>
    <text x="1218" y="680" class="node-sub">回到原对话</text>
    <text x="1218" y="708" class="node-sub">60 秒内出 PR</text>
    <text x="1218" y="742" class="node-fine">身份声明 + 验证</text>
    <text x="1218" y="770" class="node-fine">一次通过合并</text>
  </g>

  <g id="note-explicit" aria-label="显性编排">
    <rect x="1198" y="866" width="322" height="190" rx="14" fill="#0b1220" stroke="#30363d" stroke-dasharray="6 5" stroke-width="1.2"/>
    <text x="1216" y="908" font-size="20" font-weight="700" fill="#fbbf24" letter-spacing="1">显性编排</text>
    <text x="1216" y="950" class="node-fine">工单有编号有状态</text>
    <text x="1216" y="980" class="node-fine">派工有独立档案</text>
    <text x="1216" y="1010" class="node-fine">决策留理由 · 可审计</text>
    <text x="1216" y="1040" class="node-fine">差别不在做，在能查</text>
  </g>

  <!-- ===== Connectors ===== -->
  <g id="connectors" aria-label="系统连接关系">
    <line x1="233" y1="526" x2="233" y2="596" class="connector" stroke="#67e8f9"
          marker-end="url(#arrow-user)"/>
    <rect x="245" y="540" width="96" height="44" rx="10" class="label-bg"/>
    <text x="293" y="569" text-anchor="middle" class="edge-label" fill="#67e8f9">发需求</text>

    <path d="M398 691 H505 V421 H632" class="connector" stroke="#67e8f9"
          marker-end="url(#arrow-user)"/>
    <rect x="430" y="530" width="120" height="44" rx="10" class="label-bg"/>
    <text x="490" y="559" text-anchor="middle" class="edge-label" fill="#67e8f9">事件进来</text>

    <line x1="803" y1="596" x2="803" y2="516" class="connector" stroke="#34d399"
          marker-end="url(#arrow-agent)"/>
    <rect x="815" y="540" width="110" height="44" rx="10" class="label-bg"/>
    <text x="870" y="569" text-anchor="middle" class="edge-label" fill="#34d399">换模型</text>

    <path d="M950 866 H1020 V560 H940 V516" class="connector" stroke="#fbbf24"
          marker-end="url(#arrow-adb)"/>
    <rect x="890" y="822" width="150" height="44" rx="10" class="label-bg"/>
    <text x="965" y="851" text-anchor="middle" class="edge-label" fill="#fbbf24">规则外先问</text>

    <line x1="974" y1="421" x2="1198" y2="421" class="connector" stroke="#34d399"
          marker-end="url(#arrow-agent)"/>
    <rect x="1031" y="399" width="110" height="44" rx="10" class="label-bg"/>
    <text x="1086" y="428" text-anchor="middle" class="edge-label" fill="#34d399">派工</text>

    <line x1="1359" y1="516" x2="1359" y2="596" class="connector" stroke="#fbbf24"
          marker-end="url(#arrow-adb)"/>
    <rect x="1371" y="540" width="100" height="44" rx="10" class="label-bg"/>
    <text x="1421" y="569" text-anchor="middle" class="edge-label" fill="#fbbf24">提 PR</text>
  </g>

</svg>
